name: Deploy ke GitHub Pages

# Menerbitkan seluruh folder public (Dashboard Salesperson dan Monitoring).
# Hanya berjalan jika repo PUBLIK (paket gratis GitHub Pages mensyaratkannya).
# Aktifkan sekali: Settings > Pages > Build and deployment > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
