name: Jaga Supabase tetap aktif

# Paket gratis Supabase dijeda otomatis kalau tidak ada aktivitas sekitar 1 minggu.
# Workflow ini mengirim satu permintaan ringan ke database tiap 3 hari agar proyek tidak dijeda.
on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kirim permintaan ke Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' public/config.js | head -1)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' public/config.js | head -1)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/store_daily?select=sale_date&limit=1" -H "apikey: $KEY")
          echo "Status: $CODE"
          test "$CODE" = "200"
