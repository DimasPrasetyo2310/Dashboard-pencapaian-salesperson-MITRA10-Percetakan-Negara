<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk Dashboard Salesperson</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#f4f6fb;color:#0e1a2b;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
    .card{width:100%;max-width:380px;background:#fff;border:1px solid #e3e8f1;border-radius:14px;padding:28px;box-shadow:0 8px 24px -12px rgba(15,37,71,.18)}
    h1{margin:0 0 4px;font-size:22px}
    p.sub{margin:0 0 20px;color:#4a576b}
    label{display:block;margin:14px 0 6px;font-size:13px;font-weight:600}
    input{width:100%;padding:10px 12px;border:1px solid #cdd5e3;border-radius:8px;font:inherit}
    input:focus-visible,button:focus-visible{outline:2px solid #2563c9;outline-offset:1px}
    input[aria-invalid="true"]{border-color:#b4271c}
    .field-error{min-height:18px;margin:4px 0 0;font-size:12.5px;color:#b4271c}
    button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:#0f2547;color:#fff;font:inherit;font-weight:600;cursor:pointer}
    .card{border-top:6px solid #f5a800}
    button:disabled{opacity:.6;cursor:progress}
    #form-error{margin-top:14px;padding:10px 12px;border-radius:8px;background:#fdeae8;color:#b4271c;font-size:13.5px}
  </style>
</head>
<body>
  <main class="card">
    <h1>Masuk Dashboard</h1>
    <p class="sub">MITRA10 Percetakan Negara. Tim: masuk dengan email dan password. Sales: masuk dengan ID Salesperson dan PIN.</p>

    <form id="login-form" novalidate>
      <label for="email">Email atau ID Salesperson</label>
      <input id="email" name="email" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="nama@mitra10.com atau S10005-0000000699" required>
      <p class="field-error" id="email-error"></p>

      <label for="password">Password / PIN</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6">
      <p class="field-error" id="password-error"></p>

      <button type="submit" id="submit">Masuk</button>
      <div id="form-error" role="alert" hidden></div>
    </form>
    <p style="margin:18px 0 0;text-align:center;font-size:13.5px"><a href="index.html" style="color:#2563c9">Kembali ke pilihan dashboard</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
